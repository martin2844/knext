name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run audit:all
      - run: docker build --tag knext:ci .
      - name: Smoke test Docker image
        run: |
          docker run --detach --name knext-ci -p 3000:3000 \
            -e AUTH_GITHUB_ID=ci-client \
            -e AUTH_GITHUB_SECRET=ci-secret \
            -e AUTH_SECRET=ci-only-secret-that-is-long-enough \
            -e AUTH_URL=http://localhost:3000 \
            -e NEXT_PUBLIC_URL=http://localhost:3000 \
            knext:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/auth/providers; then
              exit 0
            fi
            sleep 1
          done
          docker logs knext-ci
          exit 1
      - name: Clean up Docker smoke test
        if: always()
        run: docker rm --force knext-ci || true
